# Render Blueprint — backend Express do ArenaHub.
# Valores secretos (DATABASE_URL etc.) são preenchidos no painel do Render (sync: false).
services:
  - type: web
    name: arenahub-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
